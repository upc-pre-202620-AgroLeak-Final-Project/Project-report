<text x="966" y="199" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">3 · Incidente</text>
<text x="968" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">ACCIÓN / TOUCHPOINT</text>
<text x="968" y="295" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Detecta desacoples, fugas u</text>
<text x="968" y="325" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">obstrucciones. Touchpoints:</text>
<text x="968" y="355" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">mangueras y goteros.</text>
<text x="968" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DIFICULTAD / EVIDENCIA</text>
<text x="968" y="505" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Horas o siguiente turno; pérdida de</text>
<text x="968" y="535" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">agua, sobrecostos y cultivo afectado.</text>
<text x="968" y="565" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">[E1-B/C]</text>
<text x="968" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">EMOCIÓN</text>
<text x="968" y="715" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Posible preocupación por las</text>
<text x="968" y="745" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">consecuencias (I).</text>
<text x="968" y="858" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">OPORTUNIDAD FUTURA</text>
<text x="968" y="890" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Mostrar evidencia y ubicación para</text>
<text x="968" y="920" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">decidir con menor demora (I).</text>
