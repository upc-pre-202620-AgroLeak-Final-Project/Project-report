<text x="1417" y="199" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">4 · Atención</text>
<text x="1419" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">ACCIÓN / TOUCHPOINT</text>
<text x="1419" y="295" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Responsable, reparación, corte y</text>
<text x="1419" y="325" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">comprobación de recuperación N/D.</text>
<text x="1419" y="355" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Touchpoint específico N/D.</text>
<text x="1419" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DIFICULTAD / EVIDENCIA</text>
<text x="1419" y="505" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Tiempo de reparación y criterio real</text>
<text x="1419" y="535" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">de reapertura N/D.</text>
<text x="1419" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">EMOCIÓN</text>
<text x="1419" y="715" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">N/D. Sin información sobre la</text>
<text x="1419" y="745" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">experiencia posterior.</text>
<text x="1419" y="858" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">OPORTUNIDAD FUTURA</text>
<text x="1419" y="890" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Cierre remoto/manual deseado</text>
<text x="1419" y="920" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">(E1-D). Investigar el procedimiento</text>
<text x="1419" y="950" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">actual.</text>
<text x="46" y="1074" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Cobertura: P1 y el rol de administración del mismo caso E1. No hay un journey independiente validado del segmento 2.</text>
<text x="46" y="1120" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">Las etapas son una reconstrucción analítica. Las oportunidades no describen prácticas actuales.</text>
<path d="M46 1190 L1834 1190" stroke="#CBDAD4" stroke-width="1" fill="none"/>
<text x="46" y="1213" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">Fuente: resumen E1 y sección 2.3.3. Emociones I = inferidas, no testimonios. N/D = no documentado. Equivalente de UXPressia.</text>
</svg>