<text x="46" y="28" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A9E5D0" dominant-baseline="text-before-edge">AGROLEAK / UPC / CAPÍTULO II</text>
<text x="46" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">J1 · Supervisión del riego — As-Is</text>
<text x="46" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E2F0EB" dominant-baseline="text-before-edge">Proceso actual del caso E1 · Sin alertas móviles ni automatización asumidas como práctica existente</text>
<rect x="46" y="182" width="431" height="865" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<rect x="46" y="182" width="431" height="62" rx="10" fill="#086B55"/>
<text x="64" y="199" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">1 · Operación</text>
<text x="66" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">ACCIÓN / TOUCHPOINT</text>
<text x="66" y="295" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Unidad con goteo, bombeo y válvulas</text>
<text x="66" y="325" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">por sector. Touchpoint:</text>
<text x="66" y="355" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">infraestructura. Programación de</text>
<text x="66" y="385" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">turnos N/D.</text>
<text x="66" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DIFICULTAD / EVIDENCIA</text>
<text x="66" y="505" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Distribución de supervisión entre</text>
<text x="66" y="535" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">personas N/D. [E1-A]</text>
<text x="66" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">EMOCIÓN</text>
<text x="66" y="715" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">N/D. No se atribuye una emoción a</text>
<text x="66" y="745" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">esta etapa.</text>
<text x="66" y="858" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">OPORTUNIDAD FUTURA</text>
<text x="66" y="890" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Identificar parcela y sector al</text>
<text x="66" y="920" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">presentar datos. Propuesta I.</text>
