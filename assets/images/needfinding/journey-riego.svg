<text x="515" y="199" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">2 · Verificación</text>
<text x="517" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">ACCIÓN / TOUCHPOINT</text>
<text x="517" y="295" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Verifica manualmente el riego.</text>
<text x="517" y="325" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Touchpoints: red y sectores. Ruta y</text>
<text x="517" y="355" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">periodicidad N/D.</text>
<text x="517" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DIFICULTAD / EVIDENCIA</text>
<text x="517" y="505" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">La revisión manual convive con</text>
<text x="517" y="535" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">detecciones tardías. [E1-B]</text>
<text x="517" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">EMOCIÓN</text>
<text x="517" y="715" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Posible incertidumbre sobre sectores</text>
<text x="517" y="745" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">no revisados (I).</text>
<text x="517" y="858" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">OPORTUNIDAD FUTURA</text>
<text x="517" y="890" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Avisos puntuales por diferencia de</text>
<text x="517" y="920" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">caudal, como prefiere E1-D.</text>
