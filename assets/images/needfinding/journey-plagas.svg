<text x="64" y="199" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">1 · Inspección</text>
<text x="66" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">ACCIÓN / TOUCHPOINT</text>
<text x="66" y="295" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Inspección manual en palta y cítricos.</text>
<text x="66" y="325" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Touchpoint: cultivo. Técnica exacta</text>
<text x="66" y="355" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">N/D.</text>
<text x="66" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DIFICULTAD / EVIDENCIA</text>
<text x="66" y="505" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Cobertura, esfuerzo y periodicidad no</text>
<text x="66" y="535" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">medidos. [E1-A/B]</text>
<text x="66" y="683" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">EMOCIÓN</text>
<text x="66" y="715" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">N/D. No se atribuye una emoción a</text>
<text x="66" y="745" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">esta etapa.</text>
<text x="66" y="858" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">OPORTUNIDAD FUTURA</text>
<text x="66" y="890" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Investigar recorridos y frecuencia</text>
<text x="66" y="920" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">antes de programar capturas (I).</text>
