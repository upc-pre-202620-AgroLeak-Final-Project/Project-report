<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1280" viewBox="0 0 1880 1280" role="img"><title>J2 · Inspección fitosanitaria — As-Is</title><desc>Proceso actual del caso E1 · No se extrapola a plagas la demora documentada para incidentes hidráulicos</desc>
