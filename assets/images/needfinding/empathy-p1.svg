<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img"><title>Empathy Map · P1</title><desc>Caso E1 · Paráfrasis del resumen; no son citas literales del video</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F4F7F5"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#102E29"/>
<text x="46" y="28" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A9E5D0" dominant-baseline="text-before-edge">AGROLEAK / UPC / CAPÍTULO II</text>
<text x="46" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">Empathy Map · P1</text>
<text x="46" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E2F0EB" dominant-baseline="text-before-edge">Caso E1 · Paráfrasis del resumen; no son citas literales del video</text>
<rect x="46" y="190" width="738" height="342" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">SAYS / DICE · E</text>
<text x="71" y="266" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Prefiere avisos de caudal y control remoto/manual antes de</text>
<text x="71" y="299" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">automatizar. Valora imagen, tipo de plaga y sector. Solicita</text>
<text x="71" y="332" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">entrada económica y ahorro comprobado.</text>
<text x="71" y="365" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="71" y="398" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">[E1-D/E/F]</text>
<rect x="816" y="190" width="738" height="342" rx="14" fill="#EAF1ED" stroke="#CCDDD5"/>
<text x="841" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">THINKS / PIENSA · I</text>
<text x="841" y="266" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Podría priorizar comprobar beneficios y conservar el control</text>
<text x="841" y="299" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">antes de delegar decisiones al sistema.</text>
<text x="841" y="332" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="841" y="365" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Interpretación pendiente: no se conoce su razonamiento</text>
<text x="841" y="398" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">interno exacto. [E1-D/F]</text>
<rect x="46" y="555" width="738" height="342" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="578" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DOES / HACE · E</text>
<text x="71" y="631" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Administra 8 hectáreas de palta y cítricos con goteo y</text>
<text x="71" y="664" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">bombeo. Verifica el riego e inspecciona plagas</text>
<text x="71" y="697" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">manualmente.</text>
<text x="71" y="730" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="71" y="763" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">[E1-A/B]</text>
<rect x="816" y="555" width="738" height="342" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="578" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">FEELS / SIENTE · E + I</text>
<text x="841" y="631" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">E: el resumen reporta receptividad tecnológica (E1-D).</text>
<text x="841" y="664" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="841" y="697" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">I: preocupación por pérdidas y cautela ante automatización.</text>
<text x="841" y="730" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Son interpretaciones, no emociones declaradas (E1-C/D).</text>
<text x="46" y="946" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">La necesidad de evidencia localizada y control humano orienta el diseño; no demuestra hábitos digitales actuales.</text>
<path d="M46 1030 L1554 1030" stroke="#CBDAD4" stroke-width="1" fill="none"/>
<text x="46" y="1053" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">Fuente: resumen E1 y sección 2.3.4. E = evidencia · I = interpretación · N/D = no documentado. Equivalente de UXPressia.</text>
</svg>