<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img"><title>P2 · Administración de fundo: cobertura parcial</title><desc>Ficha provisional del segmento 2 · No representa una segunda entrevista</desc>
<rect x="0" y="0" width="1600" height="1090" rx="0" fill="#F4F7F5"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#102E29"/>
<text x="46" y="28" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A9E5D0" dominant-baseline="text-before-edge">AGROLEAK / UPC / CAPÍTULO II</text>
<text x="46" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">P2 · Administración de fundo: cobertura parcial</text>
<text x="46" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E2F0EB" dominant-baseline="text-before-edge">Ficha provisional del segmento 2 · No representa una segunda entrevista</text>
<rect x="46" y="182" width="1508" height="80" rx="12" fill="#DDEFE7"/>
<text x="68" y="203" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">Solo existe evidencia del rol administrativo de E1; falta un representante independiente.</text>
<rect x="46" y="286" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="309" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">ROL OBSERVADO · E</text>
<text x="71" y="362" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">E1 administra una empresa agrícola de 8 hectáreas. Esa función</text>
<text x="71" y="392" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">se conoce; no acredita una jefatura de mayor escala. [E1-A]</text>
<rect x="816" y="286" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="309" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">PROBLEMA DEL CASO · E</text>
<text x="841" y="362" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Incidencias de riego y sobrecostos de bombeo. Su alcance en</text>
<text x="841" y="392" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">grandes fundos todavía no está documentado. [E1-B/C]</text>
<rect x="46" y="514" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="537" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">PREFERENCIAS DEL CASO · E</text>
<text x="71" y="590" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Control remoto/manual y compra condicionada a ahorro. No se</text>
<text x="71" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">conoce su autoridad formal de adquisición. [E1-D/F]</text>
<rect x="816" y="514" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="537" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">SIN RESPALDO · N/D</text>
<text x="841" y="590" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Equipo y jerarquías; protocolos de escalamiento; reportes;</text>
<text x="841" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">presupuesto; indicadores de ROI; herramientas de gestión</text>
<text x="841" y="650" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">actuales.</text>
<rect x="46" y="742" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="765" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">SIGUIENTE VALIDACIÓN</text>
<text x="71" y="818" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Entrevistar a una jefatura independiente. Reconstruir delegación,</text>
<text x="71" y="848" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">turnos, autorizaciones, reportes y una decisión real de compra.</text>
<rect x="816" y="742" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="765" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">REGLA DE INTERPRETACIÓN</text>
<text x="841" y="818" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">No duplicar al participante E1 ni trasladar a este segmento las</text>
<text x="841" y="848" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">hipótesis demográficas del capítulo I como hallazgos de</text>
<text x="841" y="878" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">entrevistas.</text>
<path d="M46 1000 L1554 1000" stroke="#CBDAD4" stroke-width="1" fill="none"/>
<text x="46" y="1023" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">E = resumen de E1 · I = interpretación · N/D = no documentado. Equivalente visual; no exportación de UXPressia.</text>
</svg>