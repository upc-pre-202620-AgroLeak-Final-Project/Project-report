<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img"><title>Empathy Map · P2: cobertura parcial</title><desc>Segmento de jefatura / administración · Sin representante independiente entrevistado</desc>
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F4F7F5"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#102E29"/>
<text x="46" y="28" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A9E5D0" dominant-baseline="text-before-edge">AGROLEAK / UPC / CAPÍTULO II</text>
<text x="46" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">Empathy Map · P2: cobertura parcial</text>
<text x="46" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E2F0EB" dominant-baseline="text-before-edge">Segmento de jefatura / administración · Sin representante independiente entrevistado</text>
<rect x="46" y="190" width="738" height="342" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">SAYS / DICE · CASO E1</text>
<text x="71" y="266" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Solo consta la preferencia de E1 por control manual/remoto y</text>
<text x="71" y="299" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">entrada económica.</text>
<text x="71" y="332" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="71" y="365" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">[E1-D/F] No hay testimonios adicionales del segmento 2.</text>
<rect x="816" y="190" width="738" height="342" rx="14" fill="#EAF1ED" stroke="#CCDDD5"/>
<text x="841" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">THINKS / PIENSA · N/D</text>
<text x="841" y="266" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">No se conocen criterios de delegación, auditoría, ROI o</text>
<text x="841" y="299" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">comparación de sectores a nivel organizacional.</text>
<text x="841" y="332" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="841" y="365" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">No se atribuyen pensamientos a este segmento.</text>
<rect x="46" y="555" width="738" height="342" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="578" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DOES / HACE · CASO E1</text>
<text x="71" y="631" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">E1 administra una unidad de 8 hectáreas (E1-A).</text>
<text x="71" y="664" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="71" y="697" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Supervisión de equipos, reportes y flujos de autorización:</text>
<text x="71" y="730" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">N/D.</text>
<rect x="816" y="555" width="738" height="342" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="578" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">FEELS / SIENTE · CASO E1</text>
<text x="841" y="631" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">La receptividad reportada corresponde solo a E1 (E1-D).</text>
<text x="841" y="664" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge"></text>
<text x="841" y="697" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Emociones ante responsabilidad sobre equipos y decisiones</text>
<text x="841" y="730" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">de mayor escala: N/D.</text>
<text x="46" y="946" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">Validación siguiente: entrevistar una jefatura independiente y reconstruir un incidente real con actores, decisiones y emociones.</text>
<path d="M46 1030 L1554 1030" stroke="#CBDAD4" stroke-width="1" fill="none"/>
<text x="46" y="1053" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">Fuente: resumen E1 y sección 2.3.4. E = evidencia · I = interpretación · N/D = no documentado. Equivalente de UXPressia.</text>
</svg>