<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img"><title>P1 · Responsable de unidad agrícola tecnificada</title><desc>Persona de un caso real · Base empírica: resumen de la Entrevista 1 · n = 1</desc>
<rect x="0" y="0" width="1600" height="1090" rx="0" fill="#F4F7F5"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#102E29"/>
<text x="46" y="28" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A9E5D0" dominant-baseline="text-before-edge">AGROLEAK / UPC / CAPÍTULO II</text>
<text x="46" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">P1 · Responsable de unidad agrícola tecnificada</text>
<text x="46" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E2F0EB" dominant-baseline="text-before-edge">Persona de un caso real · Base empírica: resumen de la Entrevista 1 · n = 1</text>
<rect x="46" y="182" width="1508" height="80" rx="12" fill="#DDEFE7"/>
<text x="68" y="203" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">Ing. Vega · 27 años · Palpa, Ica · 8 hectáreas de palta y cítricos [E1-A]</text>
<rect x="46" y="286" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="309" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">CONTEXTO Y PRÁCTICAS · E</text>
<text x="71" y="362" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Administra la unidad con riego por goteo, bombeo y válvulas por</text>
<text x="71" y="392" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">sector. Verifica riego e inspecciona plagas manualmente. [E1-A/B]</text>
<rect x="816" y="286" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="309" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">DIFICULTADES · E</text>
<text x="841" y="362" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Desacoples, fugas u obstrucciones: detección en horas o hasta el</text>
<text x="841" y="392" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">siguiente turno. Agua desperdiciada, sobrecostos y cultivo</text>
<text x="841" y="422" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">afectado. [E1-B/C]</text>
<rect x="46" y="514" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="537" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">NECESIDAD SINTETIZADA · I</text>
<text x="71" y="590" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Advertir incidencias oportunamente y disponer de evidencia</text>
<text x="71" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">localizada para decidir. Síntesis de diseño, no cita textual.</text>
<text x="71" y="650" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">[E1-B/D/E]</text>
<rect x="816" y="514" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="537" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">INTERACCIÓN DESEADA · E</text>
<text x="841" y="590" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Avisos móviles puntuales y cierre remoto/manual antes de</text>
<text x="841" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">automatización total. Imagen, tipo de plaga y sector para focalizar</text>
<text x="841" y="650" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">la atención. [E1-D/E]</text>
<rect x="46" y="742" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="71" y="765" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">ADOPCIÓN · E</text>
<text x="71" y="818" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">Alquiler, suscripción o instalación accesible con mantenimiento</text>
<text x="71" y="848" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">económico. Evaluaría comprar después de comprobar el ahorro.</text>
<text x="71" y="878" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">[E1-F]</text>
<rect x="816" y="742" width="738" height="208" rx="14" fill="#FFFFFF" stroke="#CCDDD5"/>
<text x="841" y="765" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#086B55" dominant-baseline="text-before-edge">LÍMITES · N/D</text>
<text x="841" y="818" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">No se conocen ingresos, formación exacta, propiedad del terreno,</text>
<text x="841" y="848" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">equipo a cargo, aplicaciones actuales ni conectividad real. No se</text>
<text x="841" y="878" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#102E29" dominant-baseline="text-before-edge">añaden rasgos ficticios.</text>
<path d="M46 1000 L1554 1000" stroke="#CBDAD4" stroke-width="1" fill="none"/>
<text x="46" y="1023" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">E = resumen de E1 · I = interpretación · N/D = no documentado. Equivalente visual; no exportación de UXPressia.</text>
</svg>