<text x="46" y="1054" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#4E655F" dominant-baseline="text-before-edge">No hay escalas de frecuencia/importancia aplicadas al participante. “Frecuente” describe incidentes, no una tarea diaria.</text>
